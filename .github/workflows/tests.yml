# Имя вашего workflow, которое будет отображаться в интерфейсе GitHub Actions
name: UI tests

# Указываем, когда будет запускаться данный workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 🔹 Джоба 1: Запуск автотестов
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2

      # 🔽 Сохраняем папку с результатами как артефакт для следующей джобы
      - name: Upload allure results
        uses: actions/upload-artifact@v4
        if: always() # Сохраняем артефакт даже если тесты упали (для отладки)
        with:
          name: allure-results
          path: allure-results
          retention-days: 5

  # 🔹 Джоба 2: Публикация отчёта
  publish-report:
    runs-on: ubuntu-latest
    needs: run-tests # ⏳ Запускается ТОЛЬКО после успешного завершения run-tests
    steps:
      # 🔼 Загружаем артефакт из предыдущей джобы
      - name: Download allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Get Allure history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generates Allure Report with history
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Deploy report to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history